<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ボタン式 扉のロック</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card-wrapper">
    <svg class="outer-border-svg">
        <rect id="svg-rect" class="outer-border-rect" x="2" y="2" width="calc(100% - 4px)" height="calc(100% - 4px)"></rect>
    </svg>

    <div class="container">
        <h2>🔒 扉のロック</h2>
        <div id="display">入力待ち...</div>

        <div class="grid">
            <button class="btn" onclick="pressButton('A')">A</button>
            <button class="btn" onclick="pressButton('H')">H</button>
            <button class="btn" onclick="pressButton('P')">P</button>
            <button class="btn" onclick="pressButton('I')">I</button>
            <button class="btn" onclick="pressButton('R')">R</button>
            <button class="btn" onclick="pressButton('C')">C</button>
            <button class="btn" onclick="pressButton('N')">N</button>
            <button class="btn" onclick="pressButton('K')">K</button>
            <button class="btn" onclick="pressButton('M')">M</button>
        </div>

        <button class="reset-btn" onclick="resetInput()">やり直す</button>
        <div id="message"></div>
    </div>
</div>
    
<script src="script.js"></script>
</body>
</html>
