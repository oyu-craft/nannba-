<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ボタン式 扉のロック</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card-wrapper">
    <svg class="outer-border-svg">
        <rect id="svg-rect" class="outer-border-rect" x="2" y="2" width="calc(100% - 4px)" height="calc(100% - 4px)"></rect>
    </svg>

    <div class="container">
        <h2>🔒 扉のロック</h2>
        <div id="display">入力待ち...</div>

        <div class="grid">
            <button class="btn" onclick="pressButton('2')">2</button>
            <button class="btn" onclick="pressButton('年')">年</button>
            <button class="btn" onclick="pressButton('学')">学</button>
            <button class="btn" onclick="pressButton('8')">8</button>
            <button class="btn" onclick="pressButton('1')">1</button>
            <button class="btn" onclick="pressButton('生')">生</button>
            <button class="btn" onclick="pressButton('組')">組</button>
            <button class="btn" onclick="pressButton('3')">3</button>
            <button class="btn" onclick="pressButton('7')">7</button>
        </div>

        <button class="reset-btn" onclick="resetInput()">やり直す</button>
        <div id="message"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
